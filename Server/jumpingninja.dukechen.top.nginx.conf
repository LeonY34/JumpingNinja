server {
    listen 80;
    listen [::]:80;
    server_name jumpingninja.dukechen.top;
    server_tokens off;

    location / {
        return 301 https://$host:9443$request_uri;
    }
}

server {
    listen 9443 ssl http2;
    listen [::]:9443 ssl http2;
    server_name jumpingninja.dukechen.top;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/jumpingninja.dukechen.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jumpingninja.dukechen.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:JumpingNinjaSSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:15050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
